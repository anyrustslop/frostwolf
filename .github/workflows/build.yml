# Builds Frostwolf (Firefox ESR, rebranded and hardened) for Windows x64 and publishes releases.
# - tag vX:      build + release of the ESR version in FIREFOX_VERSION
# - daily:       if Mozilla published a newer Firefox ESR (security updates), build + release it
# - push to main / manual run: test build, uploaded as a workflow artifact (no release)
# Source code lives on Codeberg (https://codeberg.org/anyrustslop/frostwolf); this repository is
# its mirror, used for builds and downloads.
name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            esr=$(python3 build/fetch_source.py latest)
          else
            esr=$(cat FIREFOX_VERSION)
          fi
          ver="${esr%esr}-$(cat FROSTWOLF_REVISION)"
          echo "esr=$esr" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://github.com/${{ github.repository }}/releases/tag/v$ver")
            [ "$code" = "200" ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Firefox $esr -> Frostwolf $ver (skip: $skip)"

      - name: Tools
        if: steps.v.outputs.skip != 'true'
        timeout-minutes: 20
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
          # msitools unpacks the Windows SDK (required). NSIS makes the installer exe: if it can't be
          # installed, the build continues and
          # only the portable zip is published.
          for i in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q &&
               timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends nsis msitools wine64; then
              break
            fi
            echo "apt attempt $i failed"; sleep 20
          done
          command -v msiextract > /dev/null || { echo "::error::msitools (msiextract) is needed to unpack the Windows SDK"; exit 1; }
          command -v makensis || echo "::warning::NSIS unavailable: no installer exe this time"

      - name: Free disk space
        if: steps.v.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null || true
          # Build on the runner's second disk, with 16 GB of swap there: Firefox's Rust crates
          # can need more than the runner's 16 GB of memory.
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null && sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/work /mnt/mozbuild && sudo chown -R "$USER" /mnt/work /mnt/mozbuild
          free -m; df -h / /mnt

      - name: Compiler cache
        if: steps.v.outputs.skip != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build Firefox ${{ steps.v.outputs.esr }} as Frostwolf
        if: steps.v.outputs.skip != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          WORK: /mnt/work
          MOZBUILD_STATE_PATH: /mnt/mozbuild
        run: |
          set +e
          # Memory / disk monitor: a line every 2 minutes, and a warning when either runs low.
          (while true; do
             sleep 120
             mem=$(free -m | awk '/Mem/{print $3"/"$2}'); swp=$(free -m | awk '/Swap/{print $3"/"$2}')
             d1=$(df -BG --output=avail / | tail -1 | tr -d ' G'); d2=$(df -BG --output=avail /mnt | tail -1 | tr -d ' G')
             echo "[monitor] $(date -u +%H:%M) mem ${mem} MB, swap ${swp} MB, free disk / ${d1}G /mnt ${d2}G"
             [ "$d1" -lt 3 ] || [ "$d2" -lt 3 ] && echo "::warning title=Disk almost full::/ ${d1}G, /mnt ${d2}G free"
             [ "$(free -m | awk '/Swap/{print $3}')" -gt 12000 ] && echo "::warning title=Memory almost full::mem ${mem} MB, swap ${swp} MB"
           done) &
          bash build/build.sh "${{ steps.v.outputs.esr }}" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Show the end of the log on the run page (readable without signing in).
            msg=$(grep -v '^::' build.log | tail -40 | sed 's/%/%25/g' | tr '\n' '|' | tail -c 3800)
            echo "::error title=Build failed (last lines)::$msg"
          fi
          exit "$rc"

      - name: Package (portable zip + installer)
        if: steps.v.outputs.skip != 'true'
        run: |
          pkg=$(ls /mnt/work/firefox-src/obj/dist/*.win64.zip | head -1)
          python3 build/package.py "$pkg" "${{ steps.v.outputs.version }}" dist
          if command -v makensis > /dev/null; then
            makensis -V2 -DVERSION="${{ steps.v.outputs.version }}" -DSRC="$PWD/dist" build/installer.nsi
          fi
          cd dist && sha256sum Frostwolf-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload build
        if: steps.v.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Frostwolf-${{ steps.v.outputs.version }}
          path: |
            dist/Frostwolf-*.zip
            dist/Frostwolf-*.exe
            dist/SHA256SUMS.txt

      - name: Signed build provenance
        if: steps.v.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Frostwolf-*

      - name: Publish release
        if: steps.v.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"; ver="${{ steps.v.outputs.version }}"
          sed -e "s/VERSION/$ver/g" -e "s/FIREFOXESR/${{ steps.v.outputs.esr }}/g" -e "s/COMMIT/$GITHUB_SHA/g" \
            .github/release-notes.md > notes.md
          extra=()
          if [ "${{ github.event_name }}" = "schedule" ]; then extra=(--target "$GITHUB_SHA"); fi
          gh release create "$tag" dist/Frostwolf-* dist/SHA256SUMS.txt \
            --title "Frostwolf $ver" --notes-file notes.md "${extra[@]}"
