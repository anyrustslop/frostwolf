[package]
name = "frostwolf-updater"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
description = "FrostWolf's automatic updater: checks GitHub for a newer release (through Tor when Tor is on), verifies its SHA-256, installs it when FrostWolf closes."
publish = false

[[bin]]
name = "frostwolf-updater"
path = "src/main.rs"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "socks-proxy"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
