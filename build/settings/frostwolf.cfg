// FrostWolf default settings (loaded by Firefox's autoconfig before any profile settings).
// defaultPref: our default, you can still change it in about:config / Settings.
// lockPref: can't be changed (only used for telemetry, which must stay off).

// ---------------------------------------------------------------- no telemetry, studies or ads
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("toolkit.coverage.opt-out", true);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("browser.discovery.enabled", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("dom.private-attribution.submission.enabled", false);
defaultPref("breakpad.reportURL", "");
defaultPref("browser.tabs.crashReporting.sendReport", false);
defaultPref("browser.crashReports.unsubmittedCheck.autoSubmit2", false);
defaultPref("extensions.pocket.enabled", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.newtabpage.activity-stream.system.showSponsored", false);
defaultPref("browser.topsites.contile.enabled", false);                      // sponsored shortcut tiles service
// New-tab weather widget (sponsored by AccuWeather, fetched from Mozilla's servers, and placed by
// your IP address): off.
defaultPref("browser.newtabpage.activity-stream.showWeather", false);
defaultPref("browser.newtabpage.activity-stream.system.showWeather", false);
defaultPref("browser.newtabpage.activity-stream.feeds.weatherfeed", false);
defaultPref("browser.newtabpage.activity-stream.widgets.system.weatherForecast.enabled", false);
defaultPref("browser.newtabpage.activity-stream.weather.locationSearchEnabled", false);
// No remote wallpapers or trending searches either.
defaultPref("browser.newtabpage.activity-stream.feeds.wallpaperfeed", false);
defaultPref("browser.newtabpage.activity-stream.newtabWallpapers.enabled", false);
defaultPref("browser.urlbar.trending.featureGate", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.default.sites", "");
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.urlbar.quicksuggest.enabled", false);
defaultPref("extensions.htmlaboutaddons.recommendations.enabled", false);
defaultPref("extensions.getAddons.showPane", false);
defaultPref("browser.shopping.experience2023.enabled", false);
defaultPref("browser.ml.enable", false);
defaultPref("browser.ml.chat.enabled", false);

// ---------------------------------------------------------------- tracking
defaultPref("browser.contentblocking.category", "strict");
defaultPref("network.cookie.cookieBehavior", 5);              // Total Cookie Protection
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("privacy.query_stripping.enabled", true);
defaultPref("privacy.query_stripping.enabled.pbmode", true);
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("privacy.userContext.enabled", true);              // containers
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);
// Forget cookies, site data, cache and history when FrostWolf closes (like LibreWolf).
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", true);
defaultPref("privacy.clearOnShutdown_v2.cache", true);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", true);
defaultPref("privacy.clearOnShutdown_v2.siteSettings", false);

// ---------------------------------------------------------------- fingerprinting (Tor Browser / Mullvad crowd)
defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.resistFingerprinting.letterboxing", true);
defaultPref("privacy.resistFingerprinting.block_mozAddonManager", true);
defaultPref("webgl.disabled", true);
defaultPref("media.peerconnection.ice.default_address_only", true);   // no local IP leaks over WebRTC
defaultPref("media.peerconnection.ice.no_host", true);
defaultPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);
defaultPref("geo.enabled", false);
defaultPref("permissions.default.geo", 2);
defaultPref("browser.display.use_system_colors", false);

// ---------------------------------------------------------------- connections
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_send_http_background_request", false);
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.dns.disablePrefetchFromHTTPS", true);
defaultPref("network.predictor.enabled", false);
defaultPref("network.http.speculative-parallel-limit", 0);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("browser.places.speculativeConnect.enabled", false);
defaultPref("browser.search.suggest.enabled", false);
defaultPref("browser.urlbar.suggest.searches", false);
defaultPref("network.connectivity-service.enabled", false);
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false); // no file hashes sent to Google
defaultPref("network.IDN_show_punycode", true);                     // spot look-alike domains
defaultPref("security.ssl.require_safe_negotiation", true);
defaultPref("security.tls.enable_0rtt_data", false);
defaultPref("security.OCSP.enabled", 0);                             // CRLite instead (no per-site OCSP pings)
defaultPref("security.pki.crlite_mode", 2);
defaultPref("security.remote_settings.crlite_filters.enabled", true);
defaultPref("security.cert_pinning.enforcement_level", 2);

// ---------------------------------------------------------------- hardening
defaultPref("pdfjs.enableScripting", false);
defaultPref("browser.download.always_ask_before_handling_new_types", true);
defaultPref("browser.download.start_downloads_in_tmp_dir", true);
defaultPref("browser.helperApps.deleteTempFileOnExit", true);
defaultPref("permissions.delegation.enabled", false);
defaultPref("network.auth.subresource-http-auth-allow", 1);
defaultPref("dom.disable_window_move_resize", true);
// DRM (Netflix, Spotify Web...) is off; turn it on in Settings > General > "Play DRM-controlled content".
defaultPref("media.eme.enabled", false);
defaultPref("media.gmp-widevinecdm.enabled", false);

// ================================================================ FrostWolf extra hardening
// Further than LibreWolf-style defaults, chosen to stay invisible in everyday browsing.
// Every line can be changed back in about:config.

// JavaScript engine attack surface: most browser exploits target the optimizing JIT. Turn it
// (and the regular-expression JIT) off, keep the fast baseline JIT so sites stay responsive.
// Heavy web apps can be somewhat slower; set javascript.options.ion back to true if you need it.
defaultPref("javascript.options.ion", false);
defaultPref("javascript.options.wasm_optimizingjit", false);
defaultPref("javascript.options.native_regexp", false);
defaultPref("dom.webgpu.enabled", false);
defaultPref("gfx.font_rendering.opentype_svg.enabled", false);   // SVG-in-font parser: rarely used, often buggy

// Process isolation: every site in its own process; no win32k system calls from web content.
defaultPref("fission.autostart", true);
defaultPref("security.sandbox.content.win32k-disable", true);

// Extensions: unsigned add-ons can't be installed (FrostWolf's own built-in add-ons are allowed
// by the build), and add-ons dropped in by other programs are never enabled silently.
lockPref("xpinstall.signatures.required", true);
defaultPref("extensions.enabledScopes", 5);          // profile + FrostWolf's own folder only
defaultPref("extensions.autoDisableScopes", 11);     // sideloaded add-ons start disabled (FrostWolf's own are enabled)
defaultPref("extensions.postDownloadThirdPartyPrompt", false);

// Windows: block protocol links scam pages abuse to launch tools (search-ms phishing, Follina...).
defaultPref("network.protocol-handler.external.search-ms", false);
defaultPref("network.protocol-handler.external.search", false);
defaultPref("network.protocol-handler.external.ms-search", false);
defaultPref("network.protocol-handler.external.ms-msdt", false);
defaultPref("network.protocol-handler.external.ms-officecmd", false);
defaultPref("network.protocol-handler.external.ms-cxh", false);
defaultPref("network.protocol-handler.external.ms-cxh-full", false);

// Encrypted DNS with malware blocking (Quad9: non-profit, Swiss, no logging of IPs), falling back
// to your normal DNS if it's unreachable. Also enables Encrypted Client Hello where sites offer it.
defaultPref("network.trr.mode", 2);
defaultPref("network.trr.uri", "https://dns.quad9.net/dns-query");
defaultPref("network.trr.custom_uri", "https://dns.quad9.net/dns-query");
defaultPref("network.dns.echconfig.enabled", true);
defaultPref("network.proxy.socks_remote_dns", true);

// Connections.
defaultPref("dom.security.https_first", true);
defaultPref("security.ssl.treat_unsafe_negotiation_as_broken", true);
defaultPref("browser.xul.error_pages.expert_bad_cert", true);

// Phishing: always show the full address (https://, www, path), so look-alikes stand out.
defaultPref("browser.urlbar.trimURLs", false);
defaultPref("browser.urlbar.trimHttps", false);

// Leave less behind on your PC: no disk cache (memory only), no form history, no form data or
// cookies in session-restore files.
defaultPref("browser.cache.disk.enable", false);
defaultPref("browser.formfill.enable", false);
defaultPref("browser.sessionstore.privacy_level", 2);

// Passwords: the built-in manager still works, but only fills a form when you click it.
defaultPref("signon.autofillForms", false);
defaultPref("signon.formlessCapture.enabled", false);

// Less tracking surface: no push-service connection, notification prompts blocked (allow a site
// in its padlock menu), no tracking beacons, no motion sensors / gamepads / VR, no history sniffing
// through link colours, no autoplaying sound or video.
defaultPref("dom.push.enabled", false);
defaultPref("permissions.default.desktop-notification", 2);
defaultPref("beacon.enabled", false);
defaultPref("device.sensors.enabled", false);
defaultPref("dom.gamepad.enabled", false);
defaultPref("dom.vr.enabled", false);
defaultPref("layout.css.visited_links_enabled", false);
defaultPref("media.autoplay.default", 5);
defaultPref("media.autoplay.blocking_policy", 2);

// ---------------------------------------------------------------- FrostWolf look and behaviour
defaultPref("extensions.activeThemeID", "frostwolf-ice@frostwolf");
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("trailhead.firstrun.didSeeAboutWelcome", true);
defaultPref("app.update.auto", false);
defaultPref("browser.tabs.firefox-view", false);
defaultPref("identity.fxaccounts.enabled", false);   // no Mozilla account sync by default (can be turned on)
